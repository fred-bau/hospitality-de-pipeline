version: 2

models:
  - name: dim_listings
    description: "Core dimensional model for Airbnb listings combining listing attributes, calendar availability, and review metrics."
    columns:
      - name: listing_id
        description: "Primary key of the listing."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_airbnb__listings')
                field: listing_id

      - name: room_type
        description: "Type of room offered."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: price_eur
        description: "Price per night in EUR. Null when the listing shows no price (not actively offered)."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: total_reviews_count
        description: "Total count of reviews received."
        data_tests:
          - not_null

      - name: total_available_days
        description: "Total available days in calendar."
        data_tests:
          - not_null

  - name: fct_reviews
    description: "Granular review events for Airbnb listings. One row per review per listing (hotels share reviews across their room listings)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['review_id', 'listing_id']
    columns:
      - name: review_id
        description: "Review identifier. Not unique on its own: the same review can appear on several listings of one hotel."
        data_tests:
          - not_null

      - name: listing_id
        description: "Foreign key referencing dim_listings."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id

      - name: review_date
        description: "Date the review was posted."
        data_tests:
          - not_null

  - name: fct_calendar
    description: "Daily availability and pricing records per listing."
    columns:
      - name: listing_id
        description: "Foreign key referencing dim_listings."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id

      - name: calendar_date
        description: "Date for calendar entry."
        data_tests:
          - not_null        